services:
  backend:
    build:
      context: ./Banking_System
      dockerfile: Dockerfile
    image: banking-system-backend:local
    container_name: banking-system-backend
    environment:
      SPRING_PROFILES_ACTIVE: local
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./banking_system_front
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
    image: banking-system-frontend:local
    container_name: banking-system-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

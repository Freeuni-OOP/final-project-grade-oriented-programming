services:
  mysql:
    image: mysql:8.4
    container_name: banking-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-Banking_System_db}
      MYSQL_USER: ${MYSQL_USER:-banking_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-banking_pass}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - banking-network

  backend:
    build:
      context: ./Banking_System
      dockerfile: Dockerfile
    container_name: banking-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-Banking_System_db}
      DB_USER: ${MYSQL_USER:-banking_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-banking_pass}
      DDL_AUTO: ${DDL_AUTO:-update}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api-docs"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
      - banking-network

  frontend:
    build:
      context: ./banking_system_front
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: banking-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - banking-network

networks:
  banking-network:
    driver: bridge

volumes:
  mysql_data:
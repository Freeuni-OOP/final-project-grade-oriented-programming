server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets (Vite outputs these under /assets) can be cached hard
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the HTML shell - it's what references the current hashed assets
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # React Router uses browser history (createBrowserRouter), so any path that
    # doesn't match a real file must fall back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
# database credentials
#
# Previously this pointed at a hardcoded cloud MySQL host with a plaintext
# root password committed to the repo. That's been removed - everything
# below is driven by environment variables (see docker-compose.yml / .env),
# defaulting to the values used by the "mysql" service in docker-compose.
# This also means the same profile now works against any real MySQL host
# (a cloud VM, a managed DB, etc.) just by setting different env vars -
# nothing here is Docker-specific.

spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:Banking_System_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.username=${DB_USER:banking_user}

spring.datasource.password=${DB_PASSWORD:banking_pass}

spring.datasource.hikari.auto-commit=false

spring.datasource.hikari.minimum-idle=5

spring.datasource.hikari.maximum-pool-size=10

spring.datasource.hikari.connection-timeout=20000

# JPA properties

spring.jpa.show-sql=false

# "validate" assumed a schema that already existed on the old cloud DB.
# A fresh MySQL container starts out empty, so this creates/updates the
# schema from the JPA entities instead. Override with DDL_AUTO=validate
# if you ever point this profile at a DB whose schema is managed elsewhere.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

spring.jpa.properties.hibernate.default_schema=${DB_NAME:Banking_System_db}

spring.jpa.open-in-view=false

# Seed data.sql once against the fresh container. continue-on-error=true is
# what makes this safe to leave on: on every restart after the first, the
# same INSERTs hit existing primary keys and fail, but those failures are
# logged and skipped rather than crashing startup, and any real data the
# app has since written (new customers, accounts, etc.) is untouched. For a
# truly clean reseed, drop the mysql volume (docker compose down -v).
spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=always

spring.sql.init.continue-on-error=true

# logging

logging.level.root=WARN

logging.level.org.hibernate.SQL=WARN

logging.level.org.springframework.web=WARN